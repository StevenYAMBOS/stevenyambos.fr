name: API CI/CD

on:
  push:
    branches: [ref]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "10.0"
      - name: Restorer les dépendances
        run: dotnet restore
      - name: Build l'application
        run: dotnet build --no-restore
